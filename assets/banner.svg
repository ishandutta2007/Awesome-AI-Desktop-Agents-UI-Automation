<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#080a14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes scannerScan {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(380px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      .animated-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 200px 100px;
      }
      .animated-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite alternate;
        transform-origin: 1000px 300px;
      }
      .floating-badge {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-badge-delayed {
        animation: floatSlow 6s ease-in-out 1.5s infinite;
      }
      .network-line {
        stroke-dasharray: 6, 6;
        animation: dashMove 3s linear infinite;
      }
      .scan-beam {
        animation: scannerScan 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Atmosphere Orbs (Background layer) -->
  <circle class="animated-orb-1" cx="220" cy="110" r="240" fill="url(#cyanOrb)" />
  <circle class="animated-orb-2" cx="980" cy="310" r="260" fill="url(#purpleOrb)" />

  <!-- Cybernetic Grid Overlay -->
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Decorative Animated Flow / Neural Paths (Background) -->
  <path class="network-line" d="M 80,360 Q 300,320 500,370 T 900,330 T 1120,380" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.35" />
  <path class="network-line" d="M 100,60 Q 400,100 700,50 T 1100,80" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.3" />

  <!-- Horizontal Scanning Laser Beam (Subtle background effect) -->
  <line class="scan-beam" x1="0" y1="20" x2="1200" y2="20" stroke="#60a5fa" stroke-width="1" opacity="0.2" />

  <!-- Dynamic Feature Badges / Floating UI Chips in Background/Midground (positioned away from center text) -->
  <g class="floating-badge" opacity="0.92">
    <!-- Chip Left Top -->
    <rect x="70" y="42" width="230" height="36" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="88" cy="60" r="5" fill="#38bdf8" filter="url(#neonGlow)" />
    <text x="104" y="66" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 Computer-Use Agents</text>
  </g>

  <g class="floating-badge-delayed" opacity="0.92">
    <!-- Chip Right Top -->
    <rect x="910" y="42" width="220" height="36" rx="18" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
    <circle cx="928" cy="60" r="5" fill="#c084fc" filter="url(#neonGlow)" />
    <text x="944" y="66" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🖥️ Desktop GUI Models</text>
  </g>

  <g class="floating-badge" opacity="0.92">
    <!-- Chip Left Bottom -->
    <rect x="80" y="340" width="210" height="36" rx="18" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" />
    <circle cx="98" cy="358" r="5" fill="#34d399" filter="url(#neonGlow)" />
    <text x="114" y="364" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">👁️ OS Vision Grounding</text>
  </g>

  <g class="floating-badge-delayed" opacity="0.92">
    <!-- Chip Right Bottom -->
    <rect x="910" y="340" width="220" height="36" rx="18" fill="url(#cardGrad)" stroke="#f472b6" stroke-width="1" />
    <circle cx="928" cy="358" r="5" fill="#f472b6" filter="url(#neonGlow)" />
    <text x="944" y="364" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Autonomous Sandboxes</text>
  </g>

  <!-- Centered Foreground Container: Clear, Unobstructed Content -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 115)">
      <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="-146" cy="0" r="5" fill="#22c55e" filter="url(#neonGlow)" />
      <text x="5" y="6" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM &amp; BENCHMARKS</text>
    </g>

    <!-- Main Title (Bold & Crisp Foreground) -->
    <text x="600" y="195" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#neonGlow)">
      AI Desktop Agents &amp; UI Automation
    </text>

    <!-- Subtitle (Clear, Legible) -->
    <text x="600" y="240" text-anchor="middle" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Vision-Action Foundation Models • Native OS Automation • Virtual Sandboxes
    </text>

    <!-- Tagline Metrics / Description -->
    <text x="600" y="280" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500">
      Tracking Claude Computer Use, OpenAI Operator, OSWorld, CUA, UI-TARS, Browser-Use &amp; Beyond
    </text>

    <!-- Center Border Accent line -->
    <line x1="420" y1="305" x2="780" y2="305" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
